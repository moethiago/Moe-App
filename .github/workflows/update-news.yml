name: Update News Headlines
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run
        run: |
          python3 - << 'EOF'
          import urllib.request, xml.etree.ElementTree as ET, re, sys
          from datetime import datetime, timezone
          from email.utils import parsedate_to_datetime
          FEEDS = [
            ('https://feeds.bbci.co.uk/sport/formula1/rss.xml','BBC F1','F1'),
            ('https://feeds.bbci.co.uk/sport/football/rss.xml','BBC Sport','FOOTBALL'),
            ('https://www.skysports.com/rss/12040','Sky F1','F1'),
            ('https://www.skysports.com/rss/11095','Sky Sports','FOOTBALL'),
            ('https://www.arabnews.com/cat/5/rss.xml','Arab News','KSA'),
          ]
          JUNK = re.compile(r'gossip|rumour|paper talk', re.I)
          items = []
          for url,src,cat in FEEDS:
            try:
              req = urllib.request.Request(url, headers={'User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(req, timeout=10) as r:
                root = ET.fromstring(r.read())
              ch = root.find('channel') or root
              n = 0
              for i in ch.findall('item'):
                if n >= 4: break
                t = i.findtext('title','').strip()
                l = i.findtext('link','').strip()
                p = i.findtext('pubDate','').strip()
                if not t or JUNK.search(t): continue
                try: d = parsedate_to_datetime(p).strftime('%b %-d')
                except: d = datetime.now(timezone.utc).strftime('%b %-d')
                items.append((t,src,cat,l,d))
                n += 1
              print(src, n)
            except Exception as e: print('SKIP',src,e)
          if not items: sys.exit(0)
          lines = []
          for t,s,c,l,d in items:
            t2 = t.replace("'","\\'")
            l2 = l.replace("'","%27")
            lines.append(f"  {{title:'{t2}',src:'{s}',cat:'{c}',link:'{l2}',date:'{d}'}},")
          nb = "FALLBACK_NEWS = [\n"+"\n".join(lines)+"\n]"
          with open('index.html','r') as f: c = f.read()
          u = re.sub(r'FALLBACK_NEWS = \[.*?\]',nb,c,flags=re.DOTALL)
          if u == c: sys.exit(0)
          with open('index.html','w') as f: f.write(u)
          print('Done',len(items))
          EOF
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --staged --quiet || git commit -m "news update [skip ci]"
          git push
