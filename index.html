<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Moe's App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=DM+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--bg-base:#0d0f18;--bg-card:#13151f;--bg-raised:#1a1d2a;--border-hi:rgba(255,255,255,0.12);--txt-primary:#eeeef2;--txt-secondary:#8a8fa8;--f1-red:#e8002d;--ig-blue:#4f9cf9;--safe-top:env(safe-area-inset-top,0px);--header-h:56px;--nav-h:52px;}
html,body{width:100%;height:100%;overflow:hidden;background:#000;color:var(--txt-primary);font-family:'DM Sans',sans-serif}
#app{width:100%;max-width:430px;height:100%;margin:0 auto;background:var(--bg-base);display:flex;flex-direction:column;overflow:hidden}
#header{flex-shrink:0;padding-top:var(--safe-top);background:rgba(13,15,24,0.97);border-bottom:1px solid var(--border-hi);height:var(--header-h);display:flex;align-items:center;padding:0 18px;justify-content:space-between}
.logo{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:22px;color:#fff}
#top-nav{flex-shrink:0;background:rgba(13,15,24,0.97);border-bottom:1px solid var(--border-hi);overflow-x:auto}
.nav-inner{display:flex;align-items:stretch;height:var(--nav-h)}
.nav-btn{padding:0 16px;border:none;background:none;color:var(--txt-secondary);font-size:10px;font-weight:700;text-transform:uppercase;cursor:pointer;white-space:nowrap}
.nav-btn.active{color:var(--ig-blue);border-bottom:2px solid var(--ig-blue)}
#scroll-wrap{flex:1;overflow-y:auto;padding:14px}
.grid-hero{background:var(--bg-card);border-radius:12px;padding:14px;margin-bottom:10px;cursor:pointer}
.grid-hero-cat{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--ig-blue);margin-bottom:5px}
.grid-hero-headline{font-size:14px;font-weight:600;line-height:1.4;color:#fff}
.f1-spinner{width:24px;height:24px;border:3px solid var(--bg-raised);border-top-color:var(--f1-red);border-radius:50%;animation:spin 0.7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="app">
  <header id="header">
    <span class="logo">Moe's App</span>
  </header>
  <nav id="top-nav">
    <div class="nav-inner" id="channel-tabs"></div>
  </nav>
  <div id="scroll-wrap">
    <div id="feed-container"></div>
  </div>
</div>

<script>
const CONFIG = {
    CHANNELS: {
        F1: { sources: ['https://feeds.bbci.co.uk/sport/formula1/rss.xml'], impact: /Winner|Pole|Penalty|Swap|DNF|Crash|FIA|Contract/i, noise: /Practice|Friday|Reflects/i },
        FOOTBALL: { sources: ['https://www.bbc.com/sport/football/rss.xml'], impact: /Sack|Transfer|Suspension|Result|Injury|Red Card/i, noise: /Rumour/i },
        BAYERN: { sources: ['https://fcbayern.com/api/rss'], impact: /Transfer|Injury|Absent|Official/i, noise: /Ceremony/i },
        KSA_FOOTBALL: { sources: ['https://www.arabnews.com/rss/sport.xml'], impact: /Transfer|Manager|Title|Disciplinary|Derby/i, noise: /Friendly/i },
        KSA_MAJOR: { sources: ['https://www.spa.gov.sa/rss/'], impact: /Policy|Economy|Decree|Ministerial|Infrastructure|Investment/i, noise: /Ribbon|Ceremony/i }
    }
};

let feedState = { active: 'F1', data: {} };

function isImpactful(title, channel) {
    const rules = CONFIG.CHANNELS[channel];
    if (rules.noise.test(title)) return false;
    return rules.impact.test(title);
}

async function fetchChannel(channel) {
    const container = document.getElementById('feed-container');
    container.innerHTML = `<div class="f1-spinner"></div>`;
    try {
        const responses = await Promise.all(CONFIG.CHANNELS[channel].sources.map(url => 
            fetch(`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(url)}`).then(r => r.json())
        ));
        feedState.data[channel] = responses.flatMap(r => r.items || []).filter(i => isImpactful(i.title, channel));
        renderFeed(channel);
    } catch (e) {
        container.innerHTML = `<div>Network Error</div>`;
    }
}

function renderFeed(channel) {
    const container = document.getElementById('feed-container');
    container.innerHTML = feedState.data[channel].map(item => `
        <div class="grid-hero" onclick="window.open('${item.link}', '_blank')">
            <div class="grid-hero-cat">${item.author || channel}</div>
            <div class="grid-hero-headline">${item.title}</div>
        </div>
    `).join('');
}

document.addEventListener('DOMContentLoaded', () => {
    const nav = document.getElementById('channel-tabs');
    Object.keys(CONFIG.CHANNELS).forEach(c => {
        const btn = document.createElement('button');
        btn.className = `nav-btn ${c === 'F1' ? 'active' : ''}`;
        btn.textContent = c.replace('_', ' ');
        btn.onclick = () => {
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            fetchChannel(c);
        };
        nav.appendChild(btn);
    });
    fetchChannel('F1');
});
</script>
</body>
</html>
